[project]
name = "exam-generation"
version = "0.1.0"
description = "CLI tool for generating Taiwan junior high school math exam questions using LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.0",
    "pydantic>=2.0",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11.9",
    "playwright>=1.40",
    "json-repair>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
web = [
    "fastapi",
    "sentry-sdk[fastapi]",
    "uvicorn[standard]",
    "sse-starlette",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "asyncpg",
    "alembic",
    "python-jose[cryptography]",
    "boto3",
    "slowapi",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]
