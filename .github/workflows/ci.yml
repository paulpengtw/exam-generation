# First CI workflow for this repository (added with issue #162).
name: CI

on:
  # Only run on pushes to long-lived branches; PR branches are covered by the
  # pull_request trigger below. Listing "**" here would double every run.
  push:
    branches: [staging, main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    # Postgres 16 service container for tests marked @pytest.mark.postgres.
    # The container is accessible at localhost:5432 while the job runs.
    # TEST_POSTGRES_URL (set below in env) points marked tests at this container;
    # DATABASE_URL is intentionally NOT set so the existing SQLite-backed tests
    # continue to use the server/db.py default (sqlite+aiosqlite:///./dev.db).
    # See: docs/adr/0035-run-claim-tests-target-postgres-in-ci.md
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Wait until Postgres is ready to accept connections before proceeding.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Postgres-marked tests read this variable.  Unmarked tests are unaffected
      # because they never reference TEST_POSTGRES_URL; DATABASE_URL stays at
      # the sqlite+aiosqlite default set inside server/db.py.
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python dependencies
        # --all-groups ensures the [dependency-groups] dev group is included
        # in addition to the optional extras (dev: pytest/ruff, web: fastapi etc.)
        run: uv sync --all-extras --all-groups

      - name: Install Playwright browser
        # uv sync installs the playwright package but not the browser binary;
        # that is a separate download (issue #659). Idempotent: skips when cached.
        run: uv run playwright install --with-deps chromium

      - name: Lint (ruff)
        # Blocking since issue #691: the 105 pre-existing errors from #162 are cleared.
        run: uv run ruff check src/ server/ tests/

      - name: Python tests (includes TS contract drift guard)
        # TEST_POSTGRES_URL is set at the job level (see env: above) so the
        # postgres-marked smoke test runs against the service container.
        # Unmarked tests continue to use SQLite; their runtime is unaffected.
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: Lint (eslint)
        # Blocking since issue #690: the set-state-in-effect errors from #162 are cleared.
        run: npm run lint

      - name: Web tests
        run: npm test
