server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /auth/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host backend:8000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host backend:8000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    chunked_transfer_encoding on;
  }

  location /health {
    proxy_pass http://backend:8000;
    proxy_set_header Host backend:8000;
  }

  # Artifact metadata — must never be cached (issue #770)
  location = /release/policy.json {
    try_files $uri =404;
    add_header Cache-Control 'no-store';
  }

  location = /build-meta.json {
    try_files $uri =404;
    add_header Cache-Control 'no-store';
  }

  # Hashed static assets — immutable, 1-year cache (issue #770)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  # SPA entry point — revalidate on every request (issue #770)
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control 'no-cache';
  }

  # SPA fallback — serve index.html only for non-asset paths (issue #770)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control 'no-cache';
  }
}
