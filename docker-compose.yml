services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examgen
      POSTGRES_USER: examgen
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examgen -d examgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://examgen:${DB_PASSWORD}@db/examgen
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    environment:
      BACKEND_HOST: backend:8000
      BACKEND_SCHEME: http
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
