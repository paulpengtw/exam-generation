services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examgen
      POSTGRES_USER: examgen
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examgen -d examgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://examgen:${DB_PASSWORD}@db/examgen
      RELEASE_AUTHORITY_URL: http://gateway:8000/release/policy.json
      RELEASE_ENVIRONMENT: ${RELEASE_ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      GATEWAY_BACKEND_URL: http://backend:8000
      GATEWAY_STATE_DIR: /var/lib/examgen-gate
      GATEWAY_CONTROL_TOKEN: ${GATEWAY_CONTROL_TOKEN:-}
      RELEASE_ENVIRONMENT: ${RELEASE_ENVIRONMENT:-production}
      GATEWAY_RELEASED_BUILD_ID: ${RELEASED_BUILD_ID:-}
      GATEWAY_RELEASE_REVISION: ${RELEASE_REVISION:-1}
      GATEWAY_READER_VERSION: ${RELEASE_READER_VERSION:-reader-1}
      GATEWAY_SUPPORTED_RECOVERY_FORMATS: ${SUPPORTED_RECOVERY_FORMATS:-json-v1}
    ports:
      - "8000:8000"
    volumes:
      - gate-state:/var/lib/examgen-gate
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    environment:
      BACKEND_HOST: gateway:8000
      BACKEND_SCHEME: http
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  pgdata:
  gate-state:
